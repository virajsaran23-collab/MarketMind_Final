<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Rise of Cryptocurrencies Cover">
  <defs>
    <linearGradient id="bgCrypto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#140a2b" />
    </linearGradient>
    <linearGradient id="goldBtc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bgCrypto)" />
  <circle cx="400" cy="200" r="160" fill="#f59e0b" opacity="0.08" />

  <!-- Bitcoin Symbol -->
  <g transform="translate(350, 100)">
    <circle cx="50" cy="80" r="60" fill="url(#goldBtc)" />
    <text x="50" y="105" text-anchor="middle" font-family="Georgia, sans-serif" font-size="72" font-weight="bold" fill="#78350f">₿</text>
  </g>

  <!-- Network Nodes -->
  <line x1="120" y1="280" x2="350" y2="180" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
  <line x1="680" y1="260" x2="450" y2="180" stroke="#38bdf8" stroke-width="3" opacity="0.6" />
  <line x1="220" y1="360" x2="400" y2="240" stroke="#a855f7" stroke-width="3" opacity="0.6" />

  <circle cx="120" cy="280" r="14" fill="#38bdf8" />
  <circle cx="680" cy="260" r="14" fill="#a855f7" />
  <circle cx="220" cy="360" r="14" fill="#34d399" />

  <!-- Bullish Trend Line -->
  <path d="M 80 400 L 220 370 L 320 380 L 460 260 L 560 300 L 720 120" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <text x="400" y="460" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#fef3c7" letter-spacing="1">THE RISE OF CRYPTOCURRENCIES</text>
</svg>
