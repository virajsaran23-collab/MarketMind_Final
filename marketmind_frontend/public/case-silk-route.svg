<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Silk Road Trade History Cover">
  <defs>
    <linearGradient id="bgSilk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c120c" />
      <stop offset="100%" stop-color="#3d2212" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bgSilk)" />
  <circle cx="550" cy="180" r="140" fill="#f59e0b" opacity="0.08" />

  <!-- Dotted Trade Route Map Trail across mountains -->
  <path d="M 100 320 Q 220 200 360 260 T 600 180 T 720 220" fill="none" stroke="url(#goldGlow)" stroke-width="6" stroke-linecap="round" stroke-dasharray="12,12" />
  
  <!-- Trade Nodes / Cities -->
  <circle cx="100" cy="320" r="12" fill="#fbbf24" stroke="#78350f" stroke-width="4" />
  <circle cx="360" cy="260" r="12" fill="#fbbf24" stroke="#78350f" stroke-width="4" />
  <circle cx="600" cy="180" r="12" fill="#fbbf24" stroke="#78350f" stroke-width="4" />
  <circle cx="720" cy="220" r="12" fill="#fbbf24" stroke="#78350f" stroke-width="4" />

  <!-- Silk Banner / Waves -->
  <path d="M 80 180 Q 200 120 380 200 T 700 140" fill="none" stroke="#fef3c7" stroke-width="3" opacity="0.4" />
  <path d="M 120 195 Q 240 135 420 215 T 740 155" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.3" />

  <text x="400" y="460" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="800" fill="#fef3c7" letter-spacing="1">THE SILK ROAD: BIRTH OF GLOBAL TRADE</text>
</svg>
