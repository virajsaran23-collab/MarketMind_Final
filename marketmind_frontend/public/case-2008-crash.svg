<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="2008 Financial Crash Cover">
  <defs>
    <linearGradient id="bg2008" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#1e0a14" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#bg2008)" />
  <circle cx="650" cy="120" r="140" fill="#ef4444" opacity="0.08" />
  
  <!-- Falling dominoes / mortgage cards -->
  <g opacity="0.3">
    <rect x="120" y="280" width="45" height="120" rx="8" fill="#334155" transform="rotate(-10 120 280)" />
    <rect x="190" y="295" width="45" height="120" rx="8" fill="#475569" transform="rotate(-25 190 295)" />
    <rect x="260" y="320" width="45" height="120" rx="8" fill="#64748b" transform="rotate(-45 260 320)" />
    <rect x="340" y="350" width="45" height="120" rx="8" fill="#94a3b8" transform="rotate(-65 340 350)" />
  </g>

  <!-- Crashing chart line -->
  <path d="M 80 140 L 220 180 L 320 120 L 440 290 L 520 240 L 720 420" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 80 140 L 220 180 L 320 120 L 440 290 L 520 240 L 720 420 L 720 460 L 80 460 Z" fill="url(#redGlow)" />
  
  <!-- Banking Pillar Icon -->
  <g transform="translate(560, 110)" fill="none" stroke="#f87171" stroke-width="4">
    <path d="M 10 40 L 90 40 L 50 10 Z" fill="#ef4444" fill-opacity="0.2" />
    <line x1="20" y1="40" x2="20" y2="100" />
    <line x1="40" y1="40" x2="40" y2="100" />
    <line x1="60" y1="40" x2="60" y2="100" />
    <line x1="80" y1="40" x2="80" y2="100" />
    <rect x="10" y="100" width="80" height="10" fill="#ef4444" fill-opacity="0.3" />
    <path d="M 45 40 L 65 90" stroke="#f87171" stroke-width="3" stroke-dasharray="4,4" />
  </g>

  <text x="400" y="460" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#fca5a5" letter-spacing="1">2008 FINANCIAL CRISIS</text>
</svg>
